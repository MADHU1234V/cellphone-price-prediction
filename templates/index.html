<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Phone Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card prediction-card">

        <div class="text-center">

            <img src="{{ url_for('static', filename='phone.png') }}" width="120">

            <h1 class="mt-3">📱 Cell Phone Price Prediction</h1>

            <p class="text-muted">
                Predict the price category using machine learning.
            </p>

        </div>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>RAM (MB)</label>

                    <input
                        type="number"
                        class="form-control"
                        name="ram"
                        placeholder="4096"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Battery Power (mAh)</label>

                    <input
                        type="number"
                        class="form-control"
                        name="battery_power"
                        placeholder="4500"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Pixel Height</label>

                    <input
                        type="number"
                        class="form-control"
                        name="px_height"
                        placeholder="1920"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Pixel Width</label>

                    <input
                        type="number"
                        class="form-control"
                        name="px_width"
                        placeholder="1080"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>3G Support</label>

                    <select class="form-select" name="three_g">

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label>4G Support</label>

                    <select class="form-select" name="four_g">

                        <option value="1">Yes</option>

                        <option value="0">No</option>

                    </select>

                </div>

            </div>

            <div class="text-center">

                <button class="btn btn-primary btn-lg">
                    Predict Price
                </button>

                <button type="reset" class="btn btn-secondary btn-lg">
                    Reset
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
